name: Build Specific Folder Docker Image

on:
  push:
    branches: [ main ]
    # Triggers ONLY when changes are made inside this specific folder
    paths:
      - 'my-playwright-folder/**'

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/playwright-tests:latest \
            -f my-playwright-folder/Dockerfile \
            my-playwright-folder/

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/playwright-tests:latest
