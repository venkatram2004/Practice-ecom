name: Python Playwright Test and Docker Build

on:
  push:
    branches: [ main ]
    paths:
      - 'my-playwright-folder/**'       # Triggers ONLY when mypython folder changes
  pull_request:
    branches: [ main ]
    paths:
      - 'my-playwright-folder/**'

jobs:
  run-python-tests:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: my-playwright-folder/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r my-playwright-folder/requirements.txt
          playwright install --with-deps chromium

      - name: Run Tests
        working-directory: mypython
        run: |
          pytest -v

  docker-build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [ run-python-tests ]
    if: github.ref == 'refs/heads/main' && success()

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Context and Dockerfile are both pointed directly to mypython/
      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/my-playwright-folder-playwright:latest my-playwright-folder/
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/my-playwright-folder-playwright:latest
