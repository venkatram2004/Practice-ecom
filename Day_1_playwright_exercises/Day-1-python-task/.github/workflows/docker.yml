name: Python Playwright Test and Docker Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  run-python-tests:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Speeds up consecutive workflow runs

      - name: Install Python Dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pytest-playwright
          fi
          # Install browser binaries and necessary system libraries
          playwright install --with-deps chromium

      - name: Execute Pytest Suite
        run: |
          pytest -v


  docker-build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [ run-python-tests ] # Dependency: Stops completely if tests fail
    if: github.ref == 'refs/heads/main' && success()

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/playwright-python-tests:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/playwright-python-tests:latest
